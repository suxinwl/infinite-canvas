services:
  infinite-canvas:
    image: ghcr.io/suxinwl/infinite-canvas:0.1.0
    container_name: infinite-canvas
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
      JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_JWT_SECRET"
      JWT_EXPIRE_HOURS: "168"
      STORAGE_DRIVER: "sqlite"
      DATABASE_DSN: "/app/data/infinite-canvas.db"
    volumes:
      - /www/server/panel/data/compose/infinite-canvas/data:/app/data:rw
    ports:
      - "127.0.0.1:48763:3000"
